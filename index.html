<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf6ec">
<title>做了沒？</title>
<link rel="apple-touch-icon" href="app-icon.png">
<link rel="icon" href="app-icon.png">
<style>
*{box-sizing:border-box}
:root{
  --blue:#78a9dc;--blue2:#edf5ff;--cream:#f3e4cf;--paper:#fff9ef;
  --brown:#4b2e20;--line:#eadfce;--muted:#8f857b;
  --pink:#ffe1e8;--orange:#fff0dd
}
html,body{margin:0;min-height:100%;background:var(--cream);color:#29231f}
body,button,input,select,textarea{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* login */
.login{position:fixed;inset:0;background:var(--cream);display:flex;align-items:center;justify-content:center;z-index:20}
.loginCard{text-align:center;background:var(--paper);border:1px solid var(--line);padding:34px;border-radius:30px;max-width:390px;margin:20px}
.loginCard img{width:145px;border-radius:34px}
.loginCard h1{font-size:38px;margin:12px 0 4px;color:var(--brown);font-weight:800}
.sub{color:#b4815c;font-weight:800;letter-spacing:1px}

/* shell */
.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}
aside{padding:24px 18px;background:#f7ead7;border-right:1px solid var(--line)}
.mini{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;margin-bottom:24px}
.mini img{width:42px;height:42px;object-fit:contain}
.nav button{width:100%;border:0;background:transparent;padding:11px 12px;border-radius:16px;text-align:left;margin:4px 0;font-weight:700;display:flex;align-items:center;gap:9px}
.nav button.active{background:var(--blue2);color:#397dc2}
.catIcon{width:35px;height:35px;object-fit:contain;object-position:center;display:block;flex:0 0 35px}
.tabLabel{flex:1}
.badge{background:#fff;border-radius:20px;padding:2px 8px;color:#777}
.user{margin-top:28px;font-size:13px;color:#8c8278;word-break:break-all}
main{padding:28px 34px;max-width:1150px;width:100%;margin:auto}

/* hero: complete illustrated banner */
.hero{
  border-radius:30px;overflow:hidden;border:1px solid #dfcdb3;
  background:#f8ead5;box-shadow:0 10px 30px #735a3218;
}
.heroBanner{display:block;width:100%;height:auto}
.heroBanner.mobile{display:none}

/* toolbar/list */
.toolbar{display:flex;gap:10px;margin:20px 0}
.quick{flex:1;display:flex;background:#fffaf2;border:1px solid var(--line);border-radius:18px;padding:7px 8px 7px 18px;box-shadow:0 5px 20px #6d53320d}
.quick input{flex:1;border:0;outline:0;background:transparent;font-size:18px;min-width:0}
.primary{border:0;background:var(--blue);color:white;font-weight:800;border-radius:14px;padding:13px 20px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.thead,.task{display:grid;grid-template-columns:34px 38px 1fr 150px 70px 46px;align-items:center;gap:10px;padding:13px 18px}
.thead{font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.task{border-bottom:1px solid #f1e8db}
.task:last-child{border-bottom:0}
.task.done .title{text-decoration:line-through;color:#aaa}
.check{width:22px;height:22px}
.title{font-weight:700}
.tag{display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 10px;border-radius:11px;font-size:13px;text-align:center}
.tagIcon{width:26px;height:26px;object-fit:contain}
.work{background:var(--orange);color:#b96e28}.personal{background:var(--pink);color:#d24f73}.kid{background:#e3f1ff;color:#3d83c8}.other{background:#eee9ff;color:#7561b5}
.star,.more,.dragHandle{border:0;background:transparent;font-size:21px}
.dragHandle{cursor:grab;color:#b8aa9b;touch-action:none;user-select:none;-webkit-user-select:none;font-size:22px;line-height:1}
.task.sorting{opacity:.55}
.task.sortable-ghost{opacity:.25}
.empty{padding:60px 20px;text-align:center;color:#9b9187}
.mobiletabs{display:none}
.batchBar{display:none;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 10px;padding:11px 14px;background:#fff8ed;border:1px solid var(--line);border-radius:16px}
.batchBar.show{display:flex}
.batchLeft{display:flex;align-items:center;gap:9px;font-weight:700;color:#6d5848}
.batchLeft input,.selectCheck{width:21px;height:21px;accent-color:#c28f67}
.danger{border:0;background:#d98278;color:white;font-weight:800;border-radius:13px;padding:10px 14px}
.danger:disabled{opacity:.45;cursor:default}
.task.doneMode{grid-template-columns:34px 38px 1fr 150px 70px 46px}
@media(max-width:760px){.task.doneMode{grid-template-columns:34px 34px 1fr 36px}.task.doneMode .selectCheck{grid-column:1;grid-row:1 / span 2}.task.doneMode .check{grid-column:2;grid-row:1}.task.doneMode .title{grid-column:3;grid-row:1}.task.doneMode .tag{grid-column:3;grid-row:2}.task.doneMode .star{grid-column:4;grid-row:1}.task.doneMode .more{grid-column:4;grid-row:2}.batchBar{position:sticky;top:8px;z-index:5;box-shadow:0 5px 18px #76552c18}}

/* dialog */
dialog{border:0;border-radius:26px;padding:0;max-width:520px;width:calc(100% - 30px);box-shadow:0 20px 70px #0003}
dialog::backdrop{background:#2b211b55}
.modal{padding:24px;background:var(--paper)}
.modal h2{margin:0 0 18px;font-size:28px}
.field{margin:13px 0}
.field label{display:block;font-size:13px;color:#766d65;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:white}
.importantField>label{display:flex;align-items:center;gap:10px;font-size:16px;color:#766d65}
.importantField input{width:24px;height:24px;flex:0 0 24px;margin:0}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.ghost{border:1px solid var(--line);background:white;border-radius:13px;padding:11px 16px}

/* mobile */
@media(max-width:760px){
  .app{display:block} aside{display:none}
  main{padding:12px 14px 100px}
  .hero{border-radius:26px}
  .heroBanner.desktop{display:none}
  .heroBanner.mobile{display:block}
  .mobiletabs{display:flex;gap:8px;overflow:auto;margin:12px 0 14px;padding:2px 0 5px;scrollbar-width:none}
  .mobiletabs::-webkit-scrollbar{display:none}
  .mobiletabs button{
    white-space:nowrap;border:1px solid var(--line);background:#fff8ed;border-radius:20px;
    padding:8px 11px;min-width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700
  }
  .mobiletabs button.active{background:var(--blue);color:white;border-color:var(--blue)}
  .mobiletabs .catIcon{width:38px;height:38px;object-fit:contain;object-position:center;display:block}
  .toolbar{margin:14px 0}
  .quick{padding-left:14px}
  .primary{padding:12px 16px}
  .thead{display:none}
  .task{grid-template-columns:28px 34px 1fr 36px;padding:15px 13px}
  .task .dragHandle{grid-column:1;grid-row:1 / span 2}
  .task .check{grid-column:2;grid-row:1}
  .task .title{grid-column:3;grid-row:1}
  .task .tag{grid-column:3;width:max-content;margin-top:4px}
  .task .star{grid-column:4;grid-row:1}
  .task .more{grid-column:4;grid-row:2}
}
@media(max-width:390px){
  .mobiletabs button{min-width:70px}
}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginCard">
    <img src="app-icon.png" alt="">
    <div class="sub">TO DO LIST</div><h1>做了沒？</h1>
    <p>手機、電腦，同一份待辦 ☁️</p>
    <button id="loginBtn" class="primary">使用 Google 登入</button>
    <p style="font-size:12px;color:#9b9187">登入後資料只會存放在你的帳號底下。</p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside>
    <div class="mini"><img src="all.png" alt="">做了沒？</div>
    <div class="nav" id="nav"></div>
    <div class="user"><div id="userName"></div><button id="logoutBtn" class="ghost" style="margin-top:10px">登出</button></div>
  </aside>
  <main>
    <section class="hero">
      <img class="heroBanner desktop" src="hero-desktop.png?v=24" alt="TO DO LIST 做了沒？把想做的事，一件一件完成吧！">
      <img class="heroBanner mobile" src="hero-mobile.png?v=24" alt="TO DO LIST 做了沒？把想做的事，一件一件完成吧！">
    </section>

    <div class="mobiletabs" id="mobiletabs"></div>

    <div class="toolbar">
      <div class="quick"><input id="quickInput" placeholder="快速新增一件事…"><button id="quickBtn" class="primary">＋ 新增</button></div>
    </div>

    <div id="batchBar" class="batchBar">
      <label class="batchLeft"><input id="selectAllDone" type="checkbox"><span id="batchText">全選已完成</span></label>
      <button id="batchDeleteBtn" class="danger" type="button" disabled>刪除已選 0 筆</button>
    </div>

    <section class="panel">
      <div class="thead"><span></span><span>待辦事項</span><span>分類</span><span>重要</span><span></span></div>
      <div id="list"></div>
    </section>
  </main>
</div>

<dialog id="dlg">
<form class="modal" method="dialog" id="form">
  <h2 id="modalTitle">新增待辦</h2>
  <div class="field"><label>待辦內容</label><input id="title" required></div>
  <div class="field"><label>分類</label><select id="category"><option value="work">工作</option><option value="personal">私人</option><option value="kid">小孩</option><option value="other">其他</option></select></div>
  <div class="field importantField"><label for="important"><input id="important" type="checkbox"><span>⭐ 重要事項</span></label></div>
  <div class="field"><label>備註</label><textarea id="note" rows="3"></textarea></div>
  <div class="actions"><button class="ghost" value="cancel">取消</button><button id="deleteBtn" type="button" class="ghost hidden">刪除</button><button class="primary" value="default">儲存</button></div>
</form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { getDatabase, ref, push, set, update, remove, onValue } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js';

const firebaseConfig={apiKey:'AIzaSyAEi1YQmtmVtWhKyf9ZOSrQYdpS19DTGm8',authDomain:'zuolemei.firebaseapp.com',databaseURL:'https://zuolemei-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'zuolemei',storageBucket:'zuolemei.firebasestorage.app',messagingSenderId:'11223352741',appId:'1:11223352741:web:d67595c4948ff1c864d44c'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getDatabase(fb),provider=new GoogleAuthProvider();
let uid=null,todos={},filter='all',editId=null,unsub=null;
let selectedDone=new Set();
const $=id=>document.getElementById(id);

$('loginBtn').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){console.error(e);alert(e?.code==='auth/popup-closed-by-user'?'登入視窗被關閉了，請再試一次。':'Google 登入失敗：'+(e?.message||e))}};
$('logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth,u=>{
  if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');uid=null;return}
  uid=u.uid;$('userName').textContent=u.displayName||u.email;
  $('login').classList.add('hidden');$('app').classList.remove('hidden');listen()
});

function listen(){
  if(unsub)unsub();
  unsub=onValue(ref(db,'users/'+uid+'/todos'),s=>{todos=s.val()||{};render()})
}

const labels={work:'工作',personal:'私人',kid:'小孩',other:'其他'};
const filters=[['all','全部'],['important','重要'],['work','工作'],['personal','私人'],['kid','小孩'],['done','已完成']];
const catIcons={all:'cat-all-v241.png',important:'cat-important-v241.png',work:'cat-work-v241.png',personal:'cat-personal-v241.png',kid:'cat-kid-v241.png',done:'cat-done-v241.png'};

function match(t,k){
  if(k==='all')return !t.done;
  if(k==='done')return !!t.done;
  if(k==='important')return !t.done&&t.important;
  if(['work','personal','kid'].includes(k))return !t.done&&t.category===k;
  return !t.done
}
function count(k){return Object.values(todos).filter(t=>match(t,k)).length}

function navs(){
  for(const id of ['nav','mobiletabs']){
    $(id).innerHTML=filters.map(([k,n])=>`<button data-f="${k}" class="${filter===k?'active':''}"><img class="catIcon" src="${catIcons[k]}" alt=""><span class="tabLabel">${n}</span>${id==='nav'?`<span class="badge">${count(k)}</span>`:''}</button>`).join('');
    $(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;if(filter!=='done')selectedDone.clear();render()})
  }
}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function orderValue(t){
  // Existing items from older versions have no sortOrder yet.
  // Use newest-first as their temporary order until the user drags them.
  return Number.isFinite(Number(t.sortOrder)) ? Number(t.sortOrder) : -(Number(t.createdAt)||Number(t.updatedAt)||0);
}
function sortedEntries(){
  return Object.entries(todos)
    .filter(([,t])=>match(t,filter))
    .sort(([,a],[,b])=>{
      // In active lists, important items always stay above normal items.
      if(filter!=='done' && !!a.important!==!!b.important) return a.important?-1:1;
      const d=orderValue(a)-orderValue(b);
      if(d!==0)return d;
      return (Number(b.createdAt)||0)-(Number(a.createdAt)||0);
    });
}
function groupTopOrder(important, done=false){
  const vals=Object.values(todos)
    .filter(t=>!!t.done===!!done && (done || !!t.important===!!important))
    .map(orderValue).filter(Number.isFinite);
  return vals.length?Math.min(...vals)-1000:0;
}
async function saveVisibleOrder(){
  const nodes=[...$('list').querySelectorAll('.task')];
  const updates={};
  // Important and normal each have their own sequence; crossing the boundary is blocked.
  for(const important of [true,false]){
    const ids=nodes.filter(n=>(n.dataset.important==='1')===important).map(n=>n.dataset.id);
    ids.forEach((id,i)=>updates[`users/${uid}/todos/${id}/sortOrder`]=i*1000);
  }
  if(Object.keys(updates).length) await update(ref(db),updates);
}
function enableSorting(){
  if(window.todoSortable){window.todoSortable.destroy();window.todoSortable=null}
  if(!$('list').querySelector('.task') || !window.Sortable)return;
  window.todoSortable=new Sortable($('list'),{
    animation:170,
    handle:'.dragHandle',
    draggable:'.task',
    ghostClass:'sortable-ghost',
    chosenClass:'sorting',
    delay:220,
    delayOnTouchOnly:true,
    touchStartThreshold:4,
    onMove(evt){
      const a=evt.dragged?.dataset.important, b=evt.related?.dataset.important;
      return a===b; // Important items cannot be dragged into the normal section (or vice versa).
    },
    onEnd(){saveVisibleOrder()}
  });
}
function render(){
  navs();
  const arr=sortedEntries();
  $('batchBar').classList.toggle('show',filter==='done');
  const validDoneIds=new Set(arr.map(([id])=>id));
  selectedDone=new Set([...selectedDone].filter(id=>validDoneIds.has(id)));
  $('list').innerHTML=arr.length?arr.map(([id,t])=>`
    <div class="task ${t.done?'done':''} ${filter==='done'?'doneMode':''}" data-id="${id}" data-important="${t.important?'1':'0'}">
      ${filter==='done'?`<input class="selectCheck" type="checkbox" data-select="${id}" ${selectedDone.has(id)?'checked':''} aria-label="選取此項目">`:`<button class="dragHandle" type="button" aria-label="拖曳排序" title="拖曳排序">☰</button>`}
      <input class="check" type="checkbox" ${t.done?'checked':''} data-check="${id}">
      <div class="title">${esc(t.title)}</div>
      <span class="tag ${t.category}"><img class="tagIcon" src="${catIcons[t.category]||catIcons.all}" alt="">${labels[t.category]||'其他'}</span>
      <button class="star" data-star="${id}">${t.important?'⭐':'☆'}</button>
      <button class="more" data-edit="${id}">•••</button>
    </div>`).join(''):'<div class="empty">這裡清清爽爽 ✨<br>新增一件想完成的事吧！</div>';

  document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{
    const t=todos[x.dataset.check];
    update(ref(db,`users/${uid}/todos/${x.dataset.check}`),{done:x.checked,sortOrder:groupTopOrder(!!t.important,x.checked)});
  });
  document.querySelectorAll('[data-star]').forEach(x=>x.onclick=()=>{
    let t=todos[x.dataset.star], next=!t.important;
    update(ref(db,`users/${uid}/todos/${x.dataset.star}`),{important:next,sortOrder:groupTopOrder(next,!!t.done)});
  });
  document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>openModal(x.dataset.edit));
  document.querySelectorAll('[data-select]').forEach(x=>x.onchange=()=>{
    if(x.checked)selectedDone.add(x.dataset.select); else selectedDone.delete(x.dataset.select);
    updateBatchBar(arr);
  });
  updateBatchBar(arr);
  if(filter!=='done') enableSorting(); else if(window.todoSortable){window.todoSortable.destroy();window.todoSortable=null}

}
function updateBatchBar(arr=sortedEntries()){
  if(filter!=='done')return;
  const ids=arr.map(([id])=>id);
  const selected=ids.filter(id=>selectedDone.has(id)).length;
  $('selectAllDone').checked=ids.length>0&&selected===ids.length;
  $('selectAllDone').indeterminate=selected>0&&selected<ids.length;
  $('batchText').textContent=selected?`已選 ${selected} 筆`:'全選已完成';
  $('batchDeleteBtn').textContent=`刪除已選 ${selected} 筆`;
  $('batchDeleteBtn').disabled=selected===0;
}
$('selectAllDone').onchange=()=>{
  const ids=sortedEntries().map(([id])=>id);
  if($('selectAllDone').checked)ids.forEach(id=>selectedDone.add(id)); else ids.forEach(id=>selectedDone.delete(id));
  render();
};
$('batchDeleteBtn').onclick=async()=>{
  const ids=[...selectedDone].filter(id=>todos[id]?.done);
  if(!ids.length)return;
  if(!confirm(`確定要一次刪除已選的 ${ids.length} 筆已完成事項嗎？\n刪除後無法復原。`))return;
  const changes={}; ids.forEach(id=>changes[`users/${uid}/todos/${id}`]=null);
  await update(ref(db),changes); selectedDone.clear();
};

function openQuickAdd(){
  const input=$('quickInput');
  const v=input.value.trim();
  if(!v)return;
  // 先讓手機輸入法結束組字並離開快速新增欄，避免 iOS 把最後一次輸入再送進彈窗。
  input.blur();
  input.value='';
  setTimeout(()=>openModal(null,v),0);
}
$('quickBtn').onclick=openQuickAdd;
$('quickInput').onkeydown=e=>{
  if(e.key!=='Enter')return;
  // 中文輸入法仍在選字／組字時，不把這次 Enter 當成送出。
  if(e.isComposing || e.keyCode===229)return;
  e.preventDefault();
  e.stopPropagation();
  openQuickAdd();
};

function openModal(id=null,prefill=''){
  editId=id;
  let t=id?todos[id]:{title:prefill,category:'personal',important:false,note:''};
  $('modalTitle').textContent=id?'編輯待辦':'新增待辦';
  $('title').value=t.title||'';$('category').value=t.category||'personal';
  $('important').checked=!!t.important;$('note').value=t.note||'';
  $('deleteBtn').classList.toggle('hidden',!id);$('dlg').showModal()
}

$('form').onsubmit=async e=>{
  e.preventDefault();
  let nextImportant=$('important').checked, oldImportant=editId?!!todos[editId].important:nextImportant;
  let data={title:$('title').value.trim(),category:$('category').value,important:nextImportant,note:$('note').value.trim(),done:editId?!!todos[editId].done:false,updatedAt:Date.now()};
  if(!editId || oldImportant!==nextImportant) data.sortOrder=groupTopOrder(nextImportant,data.done);
  if(!data.title)return;
  if(editId)await update(ref(db,`users/${uid}/todos/${editId}`),data);
  else{let r=push(ref(db,`users/${uid}/todos`));await set(r,{...data,createdAt:Date.now()})}
  $('quickInput').value='';$('dlg').close()
};
$('deleteBtn').onclick=async()=>{
  if(editId&&confirm('確定刪除這件待辦？')){await remove(ref(db,`users/${uid}/todos/${editId}`));$('dlg').close()}
};
</script>
</body>
</html>
